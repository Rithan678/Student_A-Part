<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study A-Part - Debug</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f8f9fa; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body>
    <div class="min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow" style="width: 100%; max-width: 450px;">
            <div class="card-body p-4">
                <h2 class="text-center mb-4 text-primary">
                    <i class="fas fa-graduation-cap me-2"></i>
                    Study A-Part
                </h2>
                
                <div class="text-center mb-4">
                    <div class="btn-group" role="group">
                        <button class="btn btn-primary" id="signinBtn">Sign In</button>
                        <button class="btn btn-outline-primary" id="signupBtn">Sign Up</button>
                    </div>
                </div>

                <form id="authForm">
                    <div class="mb-3" id="nameField" style="display: none;">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="Enter your full name">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Enter your email" value="demo@student.com">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" placeholder="Enter your password">
                    </div>

                    <div class="signup-fields" style="display: none;">
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" placeholder="Confirm your password">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" class="form-control">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">College/University</label>
                            <input type="text" class="form-control" placeholder="Enter your college/university name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">ID Proof (Optional)</label>
                            <input type="file" class="form-control" accept=".jpg,.jpeg,.png,.pdf">
                            <div class="form-text">Upload Aadhaar, Passport, or College ID (JPEG, PNG, PDF - Max 5MB)</div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">Sign In</button>

                    <div class="alert alert-info small">
                        <strong>Debug Mode:</strong> This is a static HTML version to test if the design loads correctly.
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let isSignUp = false;
        
        document.getElementById('signinBtn').addEventListener('click', function() {
            isSignUp = false;
            updateForm();
        });
        
        document.getElementById('signupBtn').addEventListener('click', function() {
            isSignUp = true;
            updateForm();
        });
        
        function updateForm() {
            const signupFields = document.querySelector('.signup-fields');
            const nameField = document.getElementById('nameField');
            const submitBtn = document.getElementById('submitBtn');
            const signinBtn = document.getElementById('signinBtn');
            const signupBtn = document.getElementById('signupBtn');
            
            if (isSignUp) {
                signupFields.style.display = 'block';
                nameField.style.display = 'block';
                submitBtn.textContent = 'Create Account';
                signinBtn.className = 'btn btn-outline-primary';
                signupBtn.className = 'btn btn-primary';
            } else {
                signupFields.style.display = 'none';
                nameField.style.display = 'none';
                submitBtn.textContent = 'Sign In';
                signinBtn.className = 'btn btn-primary';
                signupBtn.className = 'btn btn-outline-primary';
            }
        }
        
        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Form submitted! This confirms the static HTML version is working.');
        });
    </script>
</body>
</html>
